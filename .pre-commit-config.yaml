---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - packaging
          - types-filelock
          - types-requests
          - click

  # Also type-check on Python 3.8, the oldest version we support. mypy 1.14.1
  # is the last release that runs on it, and the other dependencies resolve to
  # their newest versions for Python 3.8, such as click 8.1.
  - repo: local
    hooks:
      - id: mypy-py38
        name: mypy (Python 3.8)
        language: python
        language_version: python3.8
        entry: mypy
        args:
          - --ignore-missing-imports
          - --scripts-are-modules
        types_or: [python, pyi]
        require_serial: true
        additional_dependencies:
          - mypy==1.14.1
          - packaging
          - types-filelock
          - types-requests
          - click

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: default, rules: {document-start: disable, truthy: disable, line-length: {max: 120}}}"

  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.2
    hooks:
      - id: go-fmt
        args:
          - "-w"
          - "-s"
