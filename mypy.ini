[mypy]
strict = true
untyped_calls_exclude = conda_package_streaming

[mypy-conda_package_streaming.*]
follow_untyped_imports = true

[mypy-ensureconda._version]
ignore_missing_imports = true

[mypy-test.*]
disallow_untyped_decorators = false

[mypy-test_binaries]
disallow_untyped_decorators = false
