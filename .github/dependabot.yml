version: 2
updates:

  # <https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot#enabling-dependabot-version-updates-for-actions>
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Open one pull request per ecosystem instead of one per dependency.
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-modules:
        patterns: ["*"]
      go-modules-security:
        applies-to: security-updates
        patterns: ["*"]

  # The hook revisions in .pre-commit-config.yaml. Dependabot has no security
  # updates for hooks, so there is only one group. It skips local hooks, which
  # leaves the mypy pin of the Python 3.8 hook alone.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
