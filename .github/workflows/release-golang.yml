name: publish-golang

on:
  release:
    # Not `created`, which never fires for releases published from drafts.
    types:
      - published
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-go-binaries:
    runs-on: ubuntu-latest
    permissions:
      # Upload the binaries to the release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
        include:
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: ppc64le

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set APP_VERSION env
        run: echo APP_VERSION=$(echo ${GITHUB_REF} | rev | cut -d'/' -f 1 | rev ) >> ${GITHUB_ENV}
      - name: Set BUILD_TIME env
        run: echo BUILD_TIME=$(date) >> ${GITHUB_ENV}

      - uses: wangyoucao577/go-release-action@279495102627de7960cbc33434ab01a12bae144b  # v1.55
        if: ${{ github.event_name == 'release' }}
        env:
          # Native linux/amd64 builds otherwise link against glibc.
          CGO_ENABLED: "0"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          build_flags: -v
          sha256sum: TRUE
          binary_name: ensureconda
          # -s -w strip the symbol table and debug info, roughly halving the download.
          ldflags: >-
            -s -w
            -X "main.appVersion=${{ env.APP_VERSION }}"
            -X "main.buildTime=${{ env.BUILD_TIME }}"
            -X main.gitCommit=${{ github.sha }}
