name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golang:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ENSURECONDA_EXE: ensureconda-linux-amd64
          - os: macos-latest
            ENSURECONDA_EXE: ensureconda-darwin-amd64
          - os: windows-latest
            ENSURECONDA_EXE: ensureconda-windows-amd64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0

      - run: go test ./...
      - run: python src/golang/build.py
      - run: python -m pip install pytest docker
      - run: python -m pytest test/test_go_binaries.py
        env:
          ENSURECONDA_EXE: ${{ matrix.ENSURECONDA_EXE }}

  python:
    name: ${{ matrix.pixi-env }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pixi-env: ["test-py38", "test-py313"]
    defaults:
      run:
        shell: bash -eo pipefail -l {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94  # v0.11.2
        with:
          environments: ${{ matrix.pixi-env }}
          activate-environment: true

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 \
                          --show-source --statistics

          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero \
                          --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          coverage run --parallel-mode -m pytest -vv test/test_python_library.py test/test_installer.py
          coverage combine --append
          coverage report -m
